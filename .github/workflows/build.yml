name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # electron-builder publishes to a draft GitHub release named after the tag.
  # Each platform job adds its own artifacts to that same draft, including the
  # latest*.yml manifests electron-updater reads — softprops/action-gh-release
  # uploaded the installers but not those manifests, so update checks 404'd.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run pre-build

      # Forks have no certificate, so the mac build falls back to unsigned and
      # skips notarization instead of failing.
      - name: Package
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ matrix.platform }}" = "--mac" ] && [ -z "$CSC_LINK" ]; then
            echo "::warning::No signing certificate configured — building unsigned and unnotarized."
            EXTRA="-c.mac.identity=null -c.mac.notarize=false"
          fi
          npx electron-builder ${{ matrix.platform }} $EXTRA --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing/notarization; ignored by the other platforms.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # Only once every platform has uploaded: generate release notes and flip the
  # draft live. Publishing earlier would offer an update to clients before the
  # other platforms' binaries exist.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body)
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest --notes "$NOTES"
